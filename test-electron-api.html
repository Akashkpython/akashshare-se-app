<!DOCTYPE html>
<html>
<head>
    <title>Electron API Test</title>
</head>
<body>
    <h1>Electron API Test</h1>
    <div id="results"></div>

    <script>
        const results = document.getElementById('results');
        
        function log(message) {
            const div = document.createElement('div');
            div.textContent = message;
            results.appendChild(div);
            console.log(message);
        }
        
        log('=== Electron API Test ===');
        log('window object: ' + typeof window);
        log('window.electronAPI: ' + typeof window.electronAPI);
        
        if (window.electronAPI) {
            log('Electron API methods: ' + Object.keys(window.electronAPI).join(', '));
            log('minimize method: ' + typeof window.electronAPI.minimize);
            log('maximize method: ' + typeof window.electronAPI.maximize);
            log('close method: ' + typeof window.electronAPI.close);
        } else {
            log('Electron API not available');
        }
        
        log('=== End Electron API Test ===');
    </script>
</body>
</html>
