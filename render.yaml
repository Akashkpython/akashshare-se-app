# Render Configuration for Akash Share
# This file configures the deployment settings for Render

services:
  # Backend Service
  - type: web
    name: akashshare-backend
    env: node
    plan: free
    autoDeploy: true
    branch: main
    buildCommand: |
      cd backend
      npm install --production
      npm list express-rate-limit
      echo "✅ Dependencies installed successfully"
    startCommand: cd backend && NODE_ENV=production HOST=0.0.0.0 PORT=5003 node start-production.js
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: HOST
        value: 0.0.0.0
      - key: PORT
        value: 5003
      - key: MONGO_URI
        value: mongodb+srv://dreamguy499:xyEz3A4YI5PkMwjR@akashshare.znzo9ht.mongodb.net/?retryWrites=true&w=majority&appName=akashshare
      - key: JWT_SECRET
        value: f8e7d6c5b4a39281706f5e4d3c2b1a0987654321fedcba0987654321fedcba0987654321fedcba0987654321fedcba0987654321fedcba0987654321fedcba09
      - key: ALLOWED_FILE_TYPES
        value: image/jpeg,image/png,image/gif,image/webp,text/plain,application/pdf
      - key: FILE_SIZE_LIMIT
        value: 10485760
      - key: RATE_LIMIT_MAX_REQUESTS
        value: 100
      - key: RATE_LIMIT_WINDOW_MS
        value: 900000
      - key: WS_CONNECTION_LIMIT
        value: 10
      - key: WS_RATE_LIMIT_MAX
        value: 5
      - key: WS_RATE_LIMIT_WINDOW
        value: 60000
      - key: CORS_ORIGIN
        value: https://akashshare-se.onrender.com
      - key: TRUST_PROXY
        value: true
      - key: ENABLE_COMPRESSION
        value: true
      - key: ENABLE_CACHING
        value: true
      - key: CACHE_TTL
        value: 3600
      - key: LOG_LEVEL
        value: info
      - key: ENABLE_REQUEST_LOGGING
        value: true
      - key: HEALTH_CHECK_ENABLED
        value: true
      - key: HEALTH_CHECK_INTERVAL
        value: 30000
      - key: NODE_OPTIONS
        value: --max-old-space-size=1024
      - key: NPM_CONFIG_PRODUCTION
        value: true
      - key: NPM_CONFIG_AUDIT
        value: false
      - key: NPM_CONFIG_FUND
        value: false

  # Frontend Service (Static Site)
  - type: web
    name: akashshare-frontend
    env: static
    plan: free
    autoDeploy: true
    branch: main
    buildCommand: npm install && npm run build
    staticPublishPath: ./build
    envVars:
      - key: REACT_APP_API_URL
        value: https://akashshare-backend.onrender.com
      - key: REACT_APP_ENV
        value: production
      - key: REACT_APP_DEBUG
        value: false