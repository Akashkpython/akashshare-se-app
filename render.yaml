# Render Configuration for Akash Share
# This file configures the deployment settings for Render

services:
  # Backend Service
  - type: web
    name: akashshare-backend
    env: node
    plan: free
    autoDeploy: true
    branch: main
    buildCommand: |
      cd backend
      rm -rf node_modules package-lock.json
      
npm install --production
      npm install mime@^2.6.0 mime-types@^2.1.35 mime-db@^1.52.0 mongodb@^6.3.0 debug@^4.3.4 --save
      npm list express-rate-limit
      npm list mime
      npm list mime-types
      npm list mime-db
      npm list mongodb
      npm list mongoose
      npm list debug
      echo "✅ All dependencies installed successfully"
    startCommand: cd backend && NODE_ENV=production HOST=0.0.0.0 PORT=5004 node start-production.js
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: HOST
        value: 0.0.0.0
      - key: PORT
        value: 5004
      - key: MONGO_URI
        value: mongodb+srv://dreamguy499:xyEz3A4YI5PkMwjR@akashshare.znzo9ht.mongodb.net/?retryWrites=true&w=majority&appName=akashshare
      - key: JWT_SECRET
        value: f8e7d6c5b4a39281706f5e4d3c2b1a0987654321fedcba0987654321fedcba0987654321fedcba0987654321fedcba0987654321fedcba0987654321fedcba09
      - key: ALLOWED_FILE_TYPES
        value: image/jpeg,image/png,image/gif,image/webp,image/bmp,image/svg+xml,image/x-icon,application/pdf,text/plain,text/csv,application/msword,application/vnd.openxmlformats-officedocument.wordprocessingml.document,application/vnd.ms-excel,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet,application/vnd.ms-powerpoint,application/vnd.openxmlformats-officedocument.presentationml.presentation,application/zip,application/x-rar-compressed,application/x-7z-compressed,video/mp4,video/quicktime,video/x-msvideo,video/x-matroska,audio/mpeg,audio/wav,audio/mp4,audio/aac,application/json,application/xml,application/javascript,text/html,text/css,application/vnd.openxmlformats-officedocument.presentationml.slideshow,application/vnd.oasis.opendocument.text,application/vnd.oasis.opendocument.spreadsheet,application/vnd.oasis.opendocument.presentation,application/x-tar,application/gzip,text/markdown,application/rtf
      - key: FILE_SIZE_LIMIT
        value: 10485760
      - key: RATE_LIMIT_MAX_REQUESTS
        value: 100
      - key: RATE_LIMIT_WINDOW_MS
        value: 900000
      - key: WS_CONNECTION_LIMIT
        value: 10
      - key: WS_RATE_LIMIT_MAX
        value: 5
      - key: WS_RATE_LIMIT_WINDOW
        value: 60000
      - key: CORS_ORIGIN
        value: https://akashshare-se.onrender.com
      - key: TRUST_PROXY
        value: true
      - key: ENABLE_COMPRESSION
        value: true
      - key: ENABLE_CACHING
        value: true
      - key: CACHE_TTL
        value: 3600
      - key: LOG_LEVEL
        value: info
      - key: ENABLE_REQUEST_LOGGING
        value: true
      - key: HEALTH_CHECK_ENABLED
        value: true
      - key: HEALTH_CHECK_INTERVAL
        value: 30000
      - key: NODE_OPTIONS
        value: --max-old-space-size=1024
      - key: NPM_CONFIG_PRODUCTION
        value: true
      - key: NPM_CONFIG_AUDIT
        value: false
      - key: NPM_CONFIG_FUND
        value: false
      - key: RENDER
        value: true

  # Frontend Service (Static Site)
  - type: web
    name: akashshare-frontend
    env: static
    plan: free
    autoDeploy: true
    branch: main
    buildCommand: npm install && npm run build
    staticPublishPath: ./build
    envVars:
      - key: REACT_APP_API_URL
        value: https://akashshare-backend.onrender.com
      - key: REACT_APP_ENV
        value: production
      - key: REACT_APP_DEBUG
        value: false